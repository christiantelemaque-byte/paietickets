<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Of - App</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8f6f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .container { max-width: 420px; width: 100%; background: white; border-radius: 32px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); }
        .auth-box h2 { font-size: 28px; margin-bottom: 4px; }
        .auth-box .sub { color: #888; margin-bottom: 24px; }
        .field { margin-bottom: 12px; }
        .field input { width: 100%; padding: 14px 16px; border-radius: 16px; border: 2px solid #e2ddd6; font-size: 15px; background: #faf9f7; }
        .field input:focus { outline: none; border-color: #d4af37; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
        .btn-primary { background: linear-gradient(145deg, #d4af37, #b8962f); color: #0f0e17; }
        .btn-outline { background: transparent; border: 2px solid #e2ddd6; color: #0f0e17; }
        .switch-link { text-align: center; margin-top: 16px; color: #888; font-size: 14px; }
        .switch-link span { color: #d4af37; font-weight: 700; cursor: pointer; }
        #extra { display: none; }
        #extra.show { display: block; }
        .name-row { display: flex; gap: 10px; }
        .name-row input { flex: 1; }
        #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #0f0e17; color: white; padding: 14px 28px; border-radius: 40px; display: none; z-index: 999; }
        #toast.show { display: block; animation: fadeUp 0.4s ease; }
        @keyframes fadeUp { 0% { opacity:0; transform: translateX(-50%) translateY(20px); } 100% { opacity:1; transform: translateX(-50%) translateY(0); } }
        #dashboard { display: none; margin-top: 20px; }
        #dashboard.show { display: block; }
        .card { background: #f8f6f0; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .stat-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ddd; }
        .stat-item:last-child { border-bottom: none; }
        .logout-btn { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 12px; border-radius: 16px; width: 100%; font-weight: 600; cursor: pointer; }
        .user-name { font-size: 22px; font-weight: 700; }
        .badge { background: #d4af37; padding: 2px 12px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; margin-left: 8px; }
        #errorMsg { display: none; background: #fef2f2; border: 1px solid #fecaca; border-radius: 16px; padding: 16px; color: #b91c1c; margin-top: 16px; text-align: center; }
        #errorMsg.show { display: block; }

        /* Tree styles */
        .tree { list-style: none; padding-left: 0; }
        .tree ul { list-style: none; padding-left: 20px; }
        .tree li { padding: 4px 0; border-left: 1px dashed #ccc; margin-left: 8px; padding-left: 12px; }
        .tree li:last-child { border-left: none; }
        .tree .node { display: flex; align-items: center; gap: 6px; }
        .tree .node .name { font-weight: 500; }
        .tree .node .code { font-size: 12px; color: #888; }
    </style>
</head>
<body>

    <div class="container">

        <!-- AUTH -->
        <div id="authContainer">
            <div class="auth-box">
                <h2>Welcome</h2>
                <p class="sub">Log in or create an account.</p>
                <div id="authForm">
                    <div class="field"><input type="email" id="authEmail" placeholder="Email" /></div>
                    <div class="field"><input type="password" id="authPassword" placeholder="Password" /></div>
                    <div id="extra">
                        <div class="field"><input type="password" id="authConfirm" placeholder="Confirm password" /></div>
                        <div class="name-row">
                            <div class="field"><input type="text" id="authFirstName" placeholder="First name" /></div>
                            <div class="field"><input type="text" id="authLastName" placeholder="Last name" /></div>
                        </div>
                        <div class="field"><input type="date" id="authBirthDate" /></div>
                        <div class="field"><input type="text" id="authReferralCode" placeholder="Referral Code (optional)" /></div>
                    </div>
                    <button class="btn btn-primary" id="authActionBtn">Log in</button>
                    <button class="btn btn-outline" id="authToggleBtn">Create account</button>
                    <div class="switch-link">
                        <span id="authSwitchText">Don't have an account?</span>
                        <span id="authSwitchLink">Sign up</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard">
            <div class="card">
                <div class="user-name" id="userNameDisplay">User <span class="badge">Premium</span></div>
                <div class="stat-item"><span>Email</span> <span id="profileEmail">-</span></div>
                <div class="stat-item"><span>Member since</span> <span id="memberSince">-</span></div>
                <div class="stat-item"><span>My Referral Code</span> <span id="myReferralCode">-</span></div>
                <div class="stat-item"><span>Total Referrals</span> <span id="referralCount">0</span></div>
            </div>

            <!-- Referral Tree -->
            <div class="card">
                <div style="font-weight:600; margin-bottom:12px;">Referral Tree</div>
                <div id="referralTreeContainer">
                    <p class="text-muted">Loading tree...</p>
                </div>
            </div>

            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>

        <div id="errorMsg">
            <p><strong>⚠️ Impossible de charger Supabase</strong></p>
            <p style="font-size:14px; margin-top:8px;">Vérifie ta connexion internet.</p>
            <button class="btn btn-outline" style="margin-top:12px;" onclick="location.reload()">Réessayer</button>
        </div>

    </div>

    <div id="toast"></div>

    <!-- ============================================================ -->
    <!-- IMPORT MAP (Supabase ESM)                                    -->
    <!-- ============================================================ -->
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
            }
        }
    </script>

    <!-- ============================================================ -->
    <!-- SCRIPT PRINCIPAL                                             -->
    <!-- ============================================================ -->
    <script type="module">
        // =============================================================
        // CONFIG
        // =============================================================
        alert('🚀 Script chargé (ES Module)');

        try {
            const { createClient } = await import('@supabase/supabase-js');
            alert('✅ Supabase importé avec succès !');

            const SUPABASE_URL = 'https://iiceaseqdzcdfgkiinnx.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_VZxq4hifeXH7kyDdi91FJg_LlzNoCiL';

            const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            alert('✅ Supabase initialisé avec succès !');

            document.getElementById('errorMsg').classList.remove('show');

            // =============================================================
            // DOM REFS
            // =============================================================
            const $ = id => document.getElementById(id);
            const authContainer = $('authContainer');
            const dashboard = $('dashboard');
            const extra = $('extra');
            const authEmail = $('authEmail');
            const authPassword = $('authPassword');
            const authConfirm = $('authConfirm');
            const authFirstName = $('authFirstName');
            const authLastName = $('authLastName');
            const authBirthDate = $('authBirthDate');
            const authReferralCode = $('authReferralCode');
            const authActionBtn = $('authActionBtn');
            const authToggleBtn = $('authToggleBtn');
            const authSwitchText = $('authSwitchText');
            const authSwitchLink = $('authSwitchLink');
            const toast = $('toast');
            const userNameDisplay = $('userNameDisplay');
            const profileEmail = $('profileEmail');
            const referralCount = $('referralCount');
            const memberSince = $('memberSince');
            const myReferralCode = $('myReferralCode');
            const referralTreeContainer = $('referralTreeContainer');
            const logoutBtn = $('logoutBtn');

            let isLoginMode = true;
            let currentUser = null;
            let allUsers = [];

            alert('✅ DOM refs prêtes');

            // =============================================================
            // TOAST
            // =============================================================
            function showToast(msg, duration = 3000) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
            }

            // =============================================================
            // TOGGLE LOGIN / SIGN UP
            // =============================================================
            function toggleAuthMode() {
                alert('🔄 toggleAuthMode called');
                isLoginMode = !isLoginMode;
                if (isLoginMode) {
                    authActionBtn.textContent = 'Log in';
                    authToggleBtn.textContent = 'Create account';
                    authSwitchText.textContent = "Don't have an account?";
                    authSwitchLink.textContent = 'Sign up';
                    extra.style.display = 'none';
                } else {
                    authActionBtn.textContent = 'Sign up';
                    authToggleBtn.textContent = 'Back to login';
                    authSwitchText.textContent = 'Already have an account?';
                    authSwitchLink.textContent = 'Log in';
                    extra.style.display = 'block';
                }
            }

            // =============================================================
            // GET DEFAULT REFERRER (ADMIN)
            // =============================================================
            async function getDefaultReferrer() {
                const { data, error } = await supabase
                    .from('users')
                    .select('id')
                    .eq('email', 'admin@stockof.com')
                    .maybeSingle();
                if (error) return null;
                return data ? data.id : null;
            }

            // =============================================================
            // HANDLE AUTH
            // =============================================================
            async function handleAuth() {
                alert('📝 handleAuth called');
                const email = authEmail.value.trim();
                const password = authPassword.value.trim();

                if (!email || !password) {
                    showToast('Please fill in email and password.');
                    alert('❌ Empty fields');
                    return;
                }

                try {
                    if (isLoginMode) {
                        alert('🔑 Attempting login...');
                        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        alert('✅ Login successful');
                        showToast('Login successful!');
                        await loadUserData(data.user);
                    } else {
                        alert('📝 Attempting sign up...');
                        const firstName = authFirstName.value.trim();
                        const lastName = authLastName.value.trim();
                        const confirm = authConfirm.value.trim();
                        const birthDate = authBirthDate.value;
                        const referralCode = authReferralCode.value.trim().toUpperCase();

                        if (!firstName || !lastName) {
                            showToast('Please enter first and last name.');
                            alert('❌ Missing name');
                            return;
                        }
                        if (password !== confirm) {
                            showToast('Passwords do not match.');
                            alert('❌ Password mismatch');
                            return;
                        }
                        if (!birthDate) {
                            showToast('Please enter date of birth.');
                            alert('❌ Missing birth date');
                            return;
                        }

                        const { data, error } = await supabase.auth.signUp({
                            email,
                            password,
                            options: { data: { first_name: firstName, last_name: lastName } }
                        });
                        if (error) throw error;
                        alert('✅ Auth signup successful');

                        const user = data.user;
                        if (!user) {
                            showToast('Account created. Please check your email to confirm, then log in.');
                            alert('📧 Confirmation required');
                            isLoginMode = true;
                            toggleAuthMode();
                            return;
                        }

                        let referrerId = null;
                        if (referralCode) {
                            const { data: referrer, error: refError } = await supabase
                                .from('users')
                                .select('id')
                                .eq('referral_code', referralCode)
                                .maybeSingle();
                            if (refError) {
                                alert('❌ Erreur recherche parrain: ' + refError.message);
                                showToast('Error finding referral code.');
                                return;
                            }
                            if (referrer) {
                                referrerId = referrer.id;
                                alert('✅ Parrain trouvé avec le code: ' + referralCode);
                            } else {
                                alert('⚠️ Code de parrainage invalide, utilisation du parrain par défaut.');
                            }
                        }

                        if (!referrerId) {
                            const defaultId = await getDefaultReferrer();
                            if (defaultId) {
                                referrerId = defaultId;
                                alert('✅ Parrain par défaut (admin) utilisé.');
                            } else {
                                alert('ℹ️ Aucun admin trouvé, ce compte sera l\'admin (sans parrain).');
                                referrerId = null;
                            }
                        }

                        // Insertion
                        const { error: insertError } = await supabase
                            .from('users')
                            .insert([{
                                id: user.id,
                                email: user.email,
                                first_name: firstName,
                                last_name: lastName,
                                birth_date: birthDate,
                                referral_code: generateReferralCode(),
                                referred_by: referrerId,
                                is_verified: true,
                            }]);

                        if (insertError) {
                            alert('❌ Insert error: ' + insertError.message);
                            showToast('Account created but profile could not be saved.');
                        } else {
                            alert('✅ Profile saved with referral');
                            showToast('Account created successfully!');
                        }

                        await loadUserData(user);
                    }
                } catch (err) {
                    alert('❌ Error: ' + err.message);
                    showToast('Error: ' + err.message);
                }
            }

            // =============================================================
            // LOGOUT
            // =============================================================
            async function logoutUser() {
                alert('🚪 Logout');
                await supabase.auth.signOut();
                currentUser = null;
                showToast('Logged out.');
                showAuthScreen();
            }

            // =============================================================
            // LOAD USER DATA
            // =============================================================
            async function loadUserData(user) {
                alert('📥 Loading user data');
                if (!user) return;
                currentUser = user;

                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('id', user.id)
                    .single();

                if (error && error.code === 'PGRST116') {
                    alert('⚠️ Creating minimal profile...');
                    const { error: insertError } = await supabase
                        .from('users')
                        .insert([{
                            id: user.id,
                            email: user.email,
                            referral_code: generateReferralCode(),
                            is_verified: true,
                        }]);
                    if (insertError) {
                        alert('❌ Insert error: ' + insertError.message);
                        showToast('Error loading profile.');
                        return;
                    }
                    const { data: newData } = await supabase
                        .from('users')
                        .select('*')
                        .eq('id', user.id)
                        .single();
                    if (newData) currentUser = { ...user, ...newData };
                } else if (data) {
                    currentUser = { ...user, ...data };
                }

                alert('✅ User data loaded: ' + currentUser.email);
                showDashboard();
                updateDashboard();
                // Load the referral tree
                await loadReferralTree();
            }

            function generateReferralCode() {
                return Math.random().toString(36).substring(2, 8).toUpperCase();
            }

            // =============================================================
            // SCREEN MANAGEMENT
            // =============================================================
            function showAuthScreen() {
                alert('📺 Showing auth screen');
                authContainer.style.display = 'block';
                dashboard.classList.remove('show');
            }

            function showDashboard() {
                alert('📺 Showing dashboard');
                authContainer.style.display = 'none';
                dashboard.classList.add('show');
            }

            // =============================================================
            // UPDATE DASHBOARD
            // =============================================================
            function updateDashboard() {
                if (!currentUser) return;
                const firstName = currentUser.first_name || '';
                const lastName = currentUser.last_name || '';
                const fullName = (firstName + ' ' + lastName).trim() || currentUser.email.split('@')[0];
                userNameDisplay.innerHTML = `${fullName} <span class="badge">Premium</span>`;
                profileEmail.textContent = currentUser.email || '-';
                memberSince.textContent = currentUser.created_at ? new Date(currentUser.created_at).toLocaleDateString() : '-';
                myReferralCode.textContent = currentUser.referral_code || 'N/A';
                // Count will be updated via tree
            }

            // =============================================================
            // REFERRAL TREE
            // =============================================================
            async function loadReferralTree() {
                alert('🌳 Loading referral tree...');
                try {
                    // Fetch all users (or at least those needed)
                    const { data, error } = await supabase
                        .from('users')
                        .select('id, first_name, last_name, email, referral_code, referred_by')
                        .order('created_at', { ascending: true });

                    if (error) throw error;
                    allUsers = data;

                    // Build tree starting from current user
                    const tree = buildTree(currentUser.id);
                    const total = countNodes(tree);
                    referralCount.textContent = total;

                    // Render tree
                    renderTree(tree);
                } catch (err) {
                    alert('❌ Error loading tree: ' + err.message);
                    referralTreeContainer.innerHTML = '<p class="text-muted">Unable to load referral tree.</p>';
                }
            }

            function buildTree(rootId) {
                // Create a map of user by id
                const userMap = {};
                allUsers.forEach(u => userMap[u.id] = u);

                // Build children map
                const childrenMap = {};
                allUsers.forEach(u => {
                    if (u.referred_by) {
                        if (!childrenMap[u.referred_by]) childrenMap[u.referred_by] = [];
                        childrenMap[u.referred_by].push(u);
                    }
                });

                // Recursive function to build tree node
                function buildNode(userId) {
                    const user = userMap[userId];
                    if (!user) return null;
                    const children = (childrenMap[userId] || []).map(child => buildNode(child.id)).filter(c => c !== null);
                    return {
                        user: user,
                        children: children
                    };
                }

                return buildNode(rootId);
            }

            function countNodes(node) {
                if (!node) return 0;
                let count = node.children.length;
                node.children.forEach(child => {
                    count += countNodes(child);
                });
                return count;
            }

            function renderTree(tree) {
                if (!tree) {
                    referralTreeContainer.innerHTML = '<p class="text-muted">No referrals yet.</p>';
                    return;
                }
                const html = buildTreeHTML(tree);
                referralTreeContainer.innerHTML = html;
            }

            function buildTreeHTML(node) {
                if (!node) return '';
                const user = node.user;
                const name = (user.first_name + ' ' + user.last_name).trim() || user.email;
                const code = user.referral_code || '';
                let html = `<li>
                    <div class="node">
                        <span class="name">${name}</span>
                        <span class="code">(${code})</span>
                    </div>`;
                if (node.children.length > 0) {
                    html += '<ul>';
                    node.children.forEach(child => {
                        html += buildTreeHTML(child);
                    });
                    html += '</ul>';
                }
                html += '</li>';
                return html;
            }

            // =============================================================
            // CHECK AUTH
            // =============================================================
            async function checkAuth() {
                alert('🔍 Checking auth...');
                showAuthScreen();
                const { data: { user } } = await supabase.auth.getUser();
                if (user) {
                    alert('✅ User already logged in: ' + user.email);
                    await loadUserData(user);
                } else {
                    alert('👤 No user logged in.');
                }
            }

            // =============================================================
            // ATTACH EVENT LISTENERS
            // =============================================================
            alert('📌 Attaching event listeners...');
            authActionBtn.addEventListener('click', handleAuth);
            authToggleBtn.addEventListener('click', toggleAuthMode);
            authSwitchLink.addEventListener('click', toggleAuthMode);
            logoutBtn.addEventListener('click', logoutUser);
            alert('✅ Event listeners attached');

            // =============================================================
            // INIT
            // =============================================================
            window.addEventListener('DOMContentLoaded', function() {
                alert('📄 DOM ready, starting checkAuth');
                checkAuth();
            });

            // Expose functions
            window.toggleAuthMode = toggleAuthMode;
            window.handleAuth = handleAuth;
            window.logoutUser = logoutUser;

        } catch (error) {
            document.getElementById('errorMsg').classList.add('show');
            alert('❌ ERREUR CRITIQUE : ' + error.message + '\n\n' + error.stack);
        }
    </script>

</body>
    </html>
