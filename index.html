<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Stock Of - Auth Test</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI',sans-serif;
            background:#f8f6f0;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:16px;
        }
        .app-container {
            max-width:420px;
            width:100%;
            background:white;
            border-radius:32px;
            box-shadow:0 20px 60px rgba(0,0,0,0.08);
            padding:20px;
        }
        .auth-box h2 { font-size:28px; margin-bottom:4px; color:#0f0e17; }
        .auth-box .sub { color:#888; margin-bottom:24px; }
        .auth-field { margin-bottom:12px; }
        .auth-field input {
            width:100%; padding:14px 16px; border-radius:16px;
            border:2px solid #e2ddd6; font-size:15px;
            background:#faf9f7; color:#0f0e17;
        }
        .auth-field input:focus {
            outline:none; border-color:#d4af37;
            background:white;
        }
        .btn-primary {
            width:100%; padding:14px;
            background:linear-gradient(145deg,#d4af37,#b8962f);
            color:#0f0e17; border:none; border-radius:16px;
            font-size:16px; font-weight:700; cursor:pointer;
        }
        .btn-outline {
            width:100%; padding:14px;
            background:transparent; color:#0f0e17;
            border:2px solid #e2ddd6; border-radius:16px;
            font-size:16px; font-weight:600; cursor:pointer;
            margin-top:8px;
        }
        .switch-link { text-align:center; margin-top:16px; color:#888; font-size:14px; }
        .switch-link span { color:#d4af37; font-weight:700; cursor:pointer; }
        #signupExtra { display:none; }
        #signupExtra.show { display:block; }
        .name-row { display:flex; gap:10px; }
        .name-row input { flex:1; }
        #toast {
            position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
            background:#0f0e17; color:white; padding:14px 28px;
            border-radius:40px; font-size:14px; font-weight:500;
            box-shadow:0 8px 32px rgba(0,0,0,0.15); z-index:999;
            display:none; max-width:90%; text-align:center;
        }
        #toast.show { display:block; animation:fadeUp 0.4s ease; }
        @keyframes fadeUp { 0%{opacity:0;transform:translateX(-50%) translateY(20px);} 100%{opacity:1;transform:translateX(-50%) translateY(0);} }
        /* Dashboard (hidden until logged in) */
        #dashboard { display:none; margin-top:20px; }
        #dashboard.show { display:block; }
        .card { background:#f8f6f0; border-radius:16px; padding:16px; margin-bottom:16px; }
        .user-name { font-size:22px; font-weight:700; }
        .badge { background:#d4af37; padding:2px 12px; border-radius:20px; font-size:10px; font-weight:700; text-transform:uppercase; }
        .stat-item { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #ddd; }
        .stat-item:last-child { border-bottom:none; }
        .logout-btn { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; padding:12px; border-radius:16px; width:100%; font-weight:600; cursor:pointer; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- AUTH -->
        <div id="authContainer">
            <div class="auth-box">
                <h2>Welcome</h2>
                <p class="sub">Log in or create an account.</p>

                <div id="authForm">
                    <div class="auth-field"><input type="email" id="authEmail" placeholder="Email" /></div>
                    <div class="auth-field"><input type="password" id="authPassword" placeholder="Password" /></div>

                    <!-- Sign-up extra fields (hidden) -->
                    <div id="signupExtra">
                        <div class="auth-field"><input type="password" id="authConfirm" placeholder="Confirm password" /></div>
                        <div class="name-row">
                            <div class="auth-field"><input type="text" id="authFirstName" placeholder="First name" /></div>
                            <div class="auth-field"><input type="text" id="authLastName" placeholder="Last name" /></div>
                        </div>
                        <div class="auth-field"><input type="date" id="authBirthDate" /></div>
                    </div>

                    <button class="btn-primary" id="authActionBtn">Log in</button>
                    <button class="btn-outline" id="authToggleBtn">Create account</button>
                    <div class="switch-link">
                        <span id="authSwitchText">Don't have an account?</span>
                        <span id="authSwitchLink">Sign up</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- DASHBOARD (simple) -->
        <div id="dashboard">
            <div class="card">
                <div class="user-name" id="userNameDisplay">User <span class="badge">Premium</span></div>
                <div class="stat-item"><span>Email</span> <span id="profileEmail">-</span></div>
                <div class="stat-item"><span>Referrals</span> <span id="referralCount">0</span></div>
                <div class="stat-item"><span>Member since</span> <span id="memberSince">-</span></div>
            </div>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>

    </div>

    <!-- TOAST -->
    <div id="toast"></div>

    <!-- ============================================================ -->
    <!-- SCRIPTS (only Supabase, no charts)                          -->
    <!-- ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script>
        // =============================================================
        // ALERTE DE DÉMARRAGE
        // =============================================================
        alert('🚀 Script principal chargé ! (étape 1)');

        try {
            // =============================================================
            // CONFIG SUPABASE
            // =============================================================
            const SUPABASE_URL = 'https://iiceaseqdzcdfgkiinnx.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_VZxq4hifeXH7kyDdi91FJg_LlzNoCiL';

            alert('🔑 Tentative d\'initialisation de Supabase...');
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            alert('✅ Supabase initialisé avec succès !');

            // =============================================================
            // DOM REFS
            // =============================================================
            const $ = (id) => document.getElementById(id);
            const authContainer = $('authContainer');
            const dashboard = $('dashboard');
            const signupExtra = $('signupExtra');
            const authEmail = $('authEmail');
            const authPassword = $('authPassword');
            const authConfirm = $('authConfirm');
            const authFirstName = $('authFirstName');
            const authLastName = $('authLastName');
            const authBirthDate = $('authBirthDate');
            const authActionBtn = $('authActionBtn');
            const authToggleBtn = $('authToggleBtn');
            const authSwitchText = $('authSwitchText');
            const authSwitchLink = $('authSwitchLink');
            const toast = $('toast');
            const userNameDisplay = $('userNameDisplay');
            const profileEmail = $('profileEmail');
            const referralCount = $('referralCount');
            const memberSince = $('memberSince');
            const logoutBtn = $('logoutBtn');

            let isLoginMode = true;
            let currentUser = null;

            alert('✅ DOM refs prêtes');

            // =============================================================
            // TOAST
            // =============================================================
            function showToast(msg, duration = 3000) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
            }

            // =============================================================
            // TOGGLE LOGIN / SIGN UP
            // =============================================================
            function toggleAuthMode() {
                alert('🔄 toggleAuthMode appelée ! (mode actuel : ' + (isLoginMode ? 'Login' : 'Sign Up') + ')');
                isLoginMode = !isLoginMode;
                if (isLoginMode) {
                    authActionBtn.textContent = 'Log in';
                    authToggleBtn.textContent = 'Create account';
                    authSwitchText.textContent = "Don't have an account?";
                    authSwitchLink.textContent = 'Sign up';
                    signupExtra.style.display = 'none';
                } else {
                    authActionBtn.textContent = 'Sign up';
                    authToggleBtn.textContent = 'Back to login';
                    authSwitchText.textContent = 'Already have an account?';
                    authSwitchLink.textContent = 'Log in';
                    signupExtra.style.display = 'block';
                }
                alert('✅ Mode changé : ' + (isLoginMode ? 'Login' : 'Sign Up'));
            }

            // =============================================================
            // HANDLE AUTH (Login / Sign Up)
            // =============================================================
            async function handleAuth() {
                alert('📝 handleAuth appelée');
                const email = authEmail.value.trim();
                const password = authPassword.value.trim();

                if (!email || !password) {
                    showToast('Please fill in email and password.');
                    alert('❌ Champs vides');
                    return;
                }

                try {
                    if (isLoginMode) {
                        alert('🔑 Tentative de connexion...');
                        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        alert('✅ Connexion réussie !');
                        showToast('Login successful!');
                        await loadUserData(data.user);
                    } else {
                        alert('📝 Tentative d\'inscription...');
                        const firstName = authFirstName.value.trim();
                        const lastName = authLastName.value.trim();
                        const confirm = authConfirm.value.trim();
                        const birthDate = authBirthDate.value;

                        if (!firstName || !lastName) {
                            showToast('Please enter your first and last name.');
                            alert('❌ Prénom ou nom manquant');
                            return;
                        }
                        if (password !== confirm) {
                            showToast('Passwords do not match.');
                            alert('❌ Mots de passe différents');
                            return;
                        }
                        if (!birthDate) {
                            showToast('Please enter your date of birth.');
                            alert('❌ Date de naissance manquante');
                            return;
                        }

                        const { data, error } = await supabase.auth.signUp({
                            email,
                            password,
                            options: { data: { first_name: firstName, last_name: lastName } }
                        });
                        if (error) throw error;
                        alert('✅ Compte créé dans Auth');

                        const user = data.user;
                        if (!user) {
                            showToast('Account created. Please check your email to confirm, then log in.');
                            alert('📧 Confirmation par email requise');
                            isLoginMode = true;
                            toggleAuthMode();
                            return;
                        }

                        const { error: insertError } = await supabase
                            .from('users')
                            .insert([{
                                id: user.id,
                                email: user.email,
                                first_name: firstName,
                                last_name: lastName,
                                birth_date: birthDate,
                                referral_code: generateReferralCode(),
                                is_verified: true,
                            }]);

                        if (insertError) {
                            console.error('Insert error:', insertError);
                            alert('❌ Erreur insertion profil : ' + insertError.message);
                            showToast('Account created but profile could not be saved.');
                        } else {
                            alert('✅ Profil utilisateur enregistré');
                            showToast('Account created successfully!');
                        }

                        await loadUserData(user);
                    }
                } catch (err) {
                    alert('❌ Erreur : ' + err.message);
                    showToast('Error: ' + err.message);
                }
            }

            // =============================================================
            // LOAD USER DATA
            // =============================================================
            async function loadUserData(user) {
                alert('📥 Chargement des données utilisateur');
                if (!user) return;
                currentUser = user;

                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('id', user.id)
                    .single();

                if (error && error.code === 'PGRST116') {
                    alert('⚠️ Utilisateur non trouvé dans la table, création...');
                    const { error: insertError } = await supabase
                        .from('users')
                        .insert([{
                            id: user.id,
                            email: user.email,
                            referral_code: generateReferralCode(),
                            is_verified: true,
                        }]);
                    if (insertError) {
                        alert('❌ Erreur création profil');
                        showToast('Error loading profile.');
                        return;
                    }
                    const { data: newData } = await supabase
                        .from('users')
                        .select('*')
                        .eq('id', user.id)
                        .single();
                    if (newData) currentUser = { ...user, ...newData };
                } else if (data) {
                    currentUser = { ...user, ...data };
                }

                alert('✅ Données chargées : ' + currentUser.email);
                showDashboard();
                updateDashboard();
            }

            function generateReferralCode() {
                return Math.random().toString(36).substring(2, 8).toUpperCase();
            }

            // =============================================================
            // SHOW / HIDE SCREENS
            // =============================================================
            function showAuthScreen() {
                alert('📺 Affichage écran de connexion');
                authContainer.style.display = 'block';
                dashboard.classList.remove('show');
            }

            function showDashboard() {
                alert('📺 Affichage dashboard');
                authContainer.style.display = 'none';
                dashboard.classList.add('show');
            }

            // =============================================================
            // UPDATE DASHBOARD
            // =============================================================
            function updateDashboard() {
                if (!currentUser) return;
                const firstName = currentUser.first_name || '';
                const lastName = currentUser.last_name || '';
                const fullName = (firstName + ' ' + lastName).trim() || currentUser.email.split('@')[0];
                userNameDisplay.innerHTML = `${fullName} <span class="badge">Premium</span>`;
                profileEmail.textContent = currentUser.email || '-';
                referralCount.textContent = currentUser.referral_count || 0;
                memberSince.textContent = currentUser.created_at ? new Date(currentUser.created_at).toLocaleDateString() : '-';
            }

            // =============================================================
            // LOGOUT
            // =============================================================
            async function logoutUser() {
                alert('🚪 Déconnexion');
                await supabase.auth.signOut();
                currentUser = null;
                showToast('Logged out.');
                showAuthScreen();
            }

            // =============================================================
            // CHECK AUTH
            // =============================================================
            async function checkAuth() {
                alert('🔍 Vérification de l\'authentification...');
                showAuthScreen();

                const { data: { user } } = await supabase.auth.getUser();
                if (user) {
                    alert('✅ Utilisateur déjà connecté : ' + user.email);
                    await loadUserData(user);
                } else {
                    alert('👤 Aucun utilisateur connecté.');
                }
            }

            // =============================================================
            // EVENT LISTENERS (avec alertes)
            // =============================================================
            authActionBtn.addEventListener('click', function(e) {
                alert('🖱️ Clic sur le bouton "Log in / Sign up"');
                handleAuth();
            });

            authToggleBtn.addEventListener('click', function(e) {
                alert('🖱️ Clic sur le bouton "Create account"');
                toggleAuthMode();
            });

            authSwitchLink.addEventListener('click', function(e) {
                alert('🖱️ Clic sur le lien "Sign up / Log in"');
                toggleAuthMode();
            });

            logoutBtn.addEventListener('click', function(e) {
                alert('🖱️ Clic sur "Logout"');
                logoutUser();
            });

            alert('✅ Tous les écouteurs d\'événements sont attachés.');

            // =============================================================
            // START
            // =============================================================
            window.addEventListener('DOMContentLoaded', function() {
                alert('📄 DOM prêt, lancement de checkAuth()');
                checkAuth();
            });

        } catch (err) {
            alert('❌ ERREUR GLOBALE : ' + err.message + '\n' + err.stack);
        }
    </script>

</body>
    </html>
