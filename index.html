<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Clic</title>
</head>
<body>

    <h1>Test de clic</h1>
    <p>Si tu vois ce texte, le HTML est chargé.</p>

    <!-- ============================================================ -->
    <!-- BOUTONS AVEC ONCLICK DIRECT                                   -->
    <!-- ============================================================ -->
    <button onclick="alert('🟢 Clic sur le bouton 1 !')">Bouton 1</button>
    <button onclick="testFunction()">Bouton 2 (appelle testFunction)</button>

    <!-- ============================================================ -->
    <!-- SCRIPT (très simple)                                         -->
    <!-- ============================================================ -->
    <script>
        // Alerte au chargement du script
        alert('🔵 Script chargé !');

        // Fonction test
        function testFunction() {
            alert('🟢 testFunction appelée !');
        }

        // Alerte de fin
        alert('🟢 Script prêt.');
    </script>

</body>
</html>
