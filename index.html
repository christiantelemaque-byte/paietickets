<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Of - Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #1a1a2e; font-size: 24px; }
        .status {
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 14px;
            background: #f5f5f5;
            border: 2px solid #ddd;
        }
        .status.loading { background: #e3f2fd; border-color: #2196f3; color: #0d3a5a; }
        .status.success { background: #e8f5e9; border-color: #4caf50; color: #1e3a1e; }
        .status.error { background: #ffebee; border-color: #f44336; color: #5a1a1a; }
        .status pre {
            background: rgba(0,0,0,0.05);
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            text-align: left;
        }
        .btn {
            padding: 12px 30px;
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover { background: #2d2d44; }
    </style>
</head>
<body>

<div class="container">
    <h1>📈 Stock Of</h1>
    <p style="color:#666; margin:10px 0;">Test de connexion à Supabase</p>

    <div id="status" class="status loading">
        ⏳ Test en cours...
    </div>

    <button class="btn" onclick="runTest()">🔄 Relancer le test</button>
</div>

<!-- ============================================================ -->
<!-- 1. Charger Supabase -->
<!-- ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<!-- ============================================================ -->
<!-- 2. Script de test -->
<!-- ============================================================ -->
<script>
    // Configuration
    const SUPABASE_URL = 'https://iiceaseqdzcdfgkiinnx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VZxq4hifeXH7kyDdi91FJg_LlzNoCiL';

    const statusDiv = document.getElementById('status');

    function setStatus(type, title, details) {
        statusDiv.className = 'status ' + type;
        let html = `<strong>${title}</strong>`;
        if (details) {
            html += `<pre>${details}</pre>`;
        }
        statusDiv.innerHTML = html;
    }

    async function runTest() {
        setStatus('loading', '⏳ Test en cours... Connexion à Supabase...');

        // Vérifier que window.supabase existe
        if (typeof window.supabase === 'undefined') {
            setStatus('error', '❌ Erreur : La bibliothèque Supabase n\'est pas chargée. Vérifie le CDN.');
            alert('La bibliothèque Supabase n\'est pas chargée !');
            return;
        }

        try {
            // Initialiser le client
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Test : vérifier que l'API répond
            const { data, error } = await supabase
                .from('gold_prices')
                .select('count', { count: 'exact', head: true });

            if (error) {
                // Erreur : afficher le message
                setStatus('error', '❌ Erreur de connexion', error.message);
                alert('❌ ERREUR : ' + error.message);
            } else {
                // Succès
                setStatus('success', '✅ Connexion réussie ! La table "gold_prices" existe.');
                alert('✅ Connexion réussie !');
            }
        } catch (err) {
            setStatus('error', '❌ Erreur inattendue', err.message);
            alert('❌ Erreur inattendue : ' + err.message);
        }
    }

    // Lancer le test au chargement
    window.addEventListener('load', function() {
        setTimeout(runTest, 300);
    });
</script>

</body>
        </html>
