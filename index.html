<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Auth</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
        input, button { display: block; width: 100%; margin: 10px 0; padding: 12px; }
        .hidden { display: none; }
        .btn { background: #d4af37; border: none; padding: 14px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Welcome</h2>
    <p class="sub">Log in or create an account.</p>

    <!-- Formulaire -->
    <div>
        <input type="email" id="authEmail" placeholder="Email" />
        <input type="password" id="authPassword" placeholder="Password" />

        <!-- Champs supplémentaires pour l'inscription (cachés par défaut) -->
        <div id="signupExtra" class="hidden">
            <input type="password" id="authConfirm" placeholder="Confirm password" />
            <input type="text" id="authFirstName" placeholder="First name" />
            <input type="text" id="authLastName" placeholder="Last name" />
            <input type="date" id="authBirthDate" />
        </div>

        <button class="btn" id="authActionBtn">Log in</button>
        <button class="btn" id="authToggleBtn">Create account</button>
        <p style="text-align:center;">
            <span id="authSwitchText">Don't have an account?</span>
            <span id="authSwitchLink" style="color:#d4af37; cursor:pointer;">Sign up</span>
        </p>
    </div>

    <script>
        // =============================================================
        // CE SCRIPT EST TRÈS SIMPLE – IL NE CONTIENT PAS SUPABASE
        // =============================================================

        // Alerte pour confirmer que le script est chargé
        alert('✅ Script chargé avec succès !');

        // Références DOM
        const signupExtra = document.getElementById('signupExtra');
        const authActionBtn = document.getElementById('authActionBtn');
        const authToggleBtn = document.getElementById('authToggleBtn');
        const authSwitchLink = document.getElementById('authSwitchLink');
        const authSwitchText = document.getElementById('authSwitchText');

        let isLoginMode = true;

        // Fonction pour basculer entre Login et Sign Up
        function toggleAuthMode() {
            alert('🔄 toggleAuthMode appelée ! (isLoginMode = ' + isLoginMode + ')');
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                authActionBtn.textContent = 'Log in';
                authToggleBtn.textContent = 'Create account';
                authSwitchText.textContent = "Don't have an account?";
                authSwitchLink.textContent = 'Sign up';
                signupExtra.classList.add('hidden');
                alert('✅ Mode Login activé – champs masqués');
            } else {
                authActionBtn.textContent = 'Sign up';
                authToggleBtn.textContent = 'Back to login';
                authSwitchText.textContent = 'Already have an account?';
                authSwitchLink.textContent = 'Log in';
                signupExtra.classList.remove('hidden');
                alert('✅ Mode Sign Up activé – champs affichés');
            }
        }

        // Fonction pour gérer l'authentification (simple alerte pour le test)
        function handleAuth() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            alert('📝 Formulaire soumis : Email=' + email + ', Password=' + password);
            if (isLoginMode) {
                alert('🔑 Tentative de connexion (simulée)');
            } else {
                const first = document.getElementById('authFirstName').value.trim();
                const last = document.getElementById('authLastName').value.trim();
                alert('📝 Inscription : ' + first + ' ' + last);
            }
        }

        // Attacher les événements
        authActionBtn.addEventListener('click', function(e) {
            alert('🖱️ Clic sur le bouton "Log in / Sign up"');
            handleAuth();
        });

        authToggleBtn.addEventListener('click', function(e) {
            alert('🖱️ Clic sur le bouton "Create account"');
            toggleAuthMode();
        });

        authSwitchLink.addEventListener('click', function(e) {
            alert('🖱️ Clic sur le lien "Sign up / Log in"');
            toggleAuthMode();
        });

        // Confirmer que tout est bien attaché
        alert('✅ Tous les écouteurs d’événements sont prêts.');
    </script>

</body>
</html>
